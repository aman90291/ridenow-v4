services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ridenow
      POSTGRES_PASSWORD: ridenow
      POSTGRES_DB: ridenow
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridenow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      # Placeholder defaults so a fresh clone comes up zero-config.
      - path: .env.example
        required: false
      # Real values live in a gitignored .env and override the placeholders.
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://ridenow:ridenow@db:5432/ridenow
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  rider-web:
    build:
      context: .
      dockerfile: apps/rider-web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      - api

  driver-web:
    build:
      context: .
      dockerfile: apps/driver-web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3002:3002"
    depends_on:
      - api

volumes:
  db_data:
